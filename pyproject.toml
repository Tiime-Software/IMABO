[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imabo"
version = "0.1.0"
description = "IMABO: Infinite Multi-Armed Bandits with Oracles for Online Hyperparameter Optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Louis Abraham", email = "louis.abraham@tiime.com"},
    {name = "Tuan-Anh Nguyen", email = "tuan-anh.nguyen@tiime.com"},
    {name = "Nicolas Devatine", email = "nicolas.devatine@tiime.com"},
]

dependencies = [
    "numpy>=1.24",
    "optuna>=3.4",
    "frozendict>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.urls]
Repository = "https://github.com/Tiime-Software/IMABO"

[tool.setuptools.packages.find]
include = ["imabo*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
