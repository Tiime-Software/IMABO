[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imabo"
version = "0.1.0"
description = "IMABO: Infinite Multi-Armed Bandits with Oracles for Online Hyperparameter Optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Louis Abraham", email = "louis.abraham@tiime.com"},
    {name = "Tuan-Anh Nguyen", email = "tuan-anh.nguyen@tiime.com"},
    {name = "Nicolas Devatine", email = "nicolas.devatine@tiime.com"},
]

dependencies = [
    "numpy>=1.24",
    "optuna>=3.4",
    "frozendict>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]
experiments = [
    "matplotlib>=3.7",
    "tqdm>=4.0",
    "joblib>=1.2",
    "aiohttp>=3.8",
    "pandas>=2.0",
    "scikit-learn>=1.6",
    # HotpotQA experiment (experiments/hotpotqa_experiment.py, benchmarks/hotpotqa/)
    "beir>=2.2",
    "python-dotenv>=1.0",
    "nltk>=3.9",
    "openrouter>=0.10",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "tenacity>=9.0",
    # Foundation-model oracles (IMABOTabFM / IMABOTabPFN in imabo/optimizer.py, tabpfn_optimizer.py)
    "tabpfn>=8.1,<9",
    "huggingface_hub>=0.24",
    "tabfm>=1.0",
    "torch>=2.2",
]

[project.urls]
Repository = "https://github.com/Tiime-Software/IMABO"

[tool.setuptools.packages.find]
include = ["imabo*", "experiments*"]
namespaces = true

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["HPOBench"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
